name: Motor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deals holen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python motor/motor.py
      - name: Speichern
        run: |
          git config user.name "deal-motor"
          git config user.email "deal-motor@users.noreply.github.com"
          git add docs/deals.json motor/sent.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Deals aktualisiert" && git pull --rebase && git push)
